name: bb-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bb/trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 全流程
        run: |
          set +e
          mkdir -p bb/logs out
          S="$GITHUB_WORKSPACE/bb/logs/summary.txt"
          : > "$S"

          NDK=$(ls $ANDROID_HOME/ndk 2>/dev/null | sort -V | tail -1)
          echo "NDK=[$NDK]" >> "$S"

          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git bb/src > /tmp/c.log 2>&1
          echo "clone rc=$?" >> "$S"

          cd bb/src || { echo "no src" >> "$S"; exit 0; }

          for f in $(grep -rl "ndkVersion" --include="*.gradle" . 2>/dev/null); do
            sed -i -E "s/ndkVersion[[:space:]]*=[[:space:]]*\"[0-9.]+\"/ndkVersion = \"$NDK\"/g" "$f"
          done

          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon > /tmp/b.log 2>&1
          echo "gradle rc=$?" >> "$S"

          echo "=== KEY LINES ===" >> "$S"
          grep -E "FAILURE|Execution failed|Caused by|^e: |error:|What went wrong" /tmp/b.log 2>/dev/null | head -30 >> "$S"
          echo "=== LAST 15 ===" >> "$S"
          tail -15 /tmp/b.log 2>/dev/null >> "$S"

          # 把 universal APK 复制到仓库里，方便手机直接下载
          UNI=$(find . -name "*universal*.apk" | head -1)
          echo "UNI=[$UNI]" >> "$S"
          if [ -n "$UNI" ]; then
            mkdir -p "$GITHUB_WORKSPACE/bb/apk"
            cp "$UNI" "$GITHUB_WORKSPACE/bb/apk/blackbox-universal-debug.apk"
            ls -l "$GITHUB_WORKSPACE/bb/apk/" >> "$S"
          fi

          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null
          exit 0

      - name: 写回
        if: always()
        run: |
          set +e
          git config user.name "bb-bot"
          git config user.email "bb-bot@users.noreply.github.com"
          git add -f bb/logs
          git add -f bb/apk 2>/dev/null
          git commit -m "bb: build log + universal apk" || echo nothing
          git push || echo skipped
          exit 0

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-apk
          path: out/
          retention-days: 30
          if-no-files-found: warn