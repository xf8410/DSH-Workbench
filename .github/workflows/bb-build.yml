name: bb-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bb/trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 全流程
        run: |
          set +e
          echo "STAGE 1 sdkmanager"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "ndk;27.2.12479018" > /tmp/n.log 2>&1
          echo "ndk rc=$?"
          NDK=$(ls "$ANDROID_HOME/ndk" 2>/dev/null | head -1)
          echo "NDK=$NDK"

          echo "STAGE 2 clone"
          mkdir -p bb
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git bb/src > /tmp/c.log 2>&1
          echo "clone rc=$?"

          echo "STAGE 3 patch"
          cd bb/src || exit 0
          if [ -n "$NDK" ]; then
            for f in $(grep -rl "ndkVersion" --include="*.gradle" . 2>/dev/null); do
              sed -i -E "s/ndkVersion[[:space:]]*=[[:space:]]*\"[0-9.]+\"/ndkVersion = \"$NDK\"/g" "$f"
            done
          fi
          grep -rh "ndkVersion" --include="*.gradle" . 2>/dev/null | head -3

          echo "STAGE 4 build"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon > /tmp/b.log 2>&1
          echo "gradle rc=$?"
          echo "--- error lines ---"
          grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|Execution failed|NDK|ndk" /tmp/b.log | head -25
          echo "--- last 25 ---"
          tail -25 /tmp/b.log

          echo "STAGE 5 save"
          mkdir -p "$GITHUB_WORKSPACE/bb/logs"
          cp /tmp/b.log "$GITHUB_WORKSPACE/bb/logs/build.txt" 2>/dev/null
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null
          ls "$GITHUB_WORKSPACE/bb/logs/" 2>/dev/null
          exit 0

      - name: 写回
        if: always()
        run: |
          set +e
          mkdir -p bb/logs out
          git config user.name "bb-bot"
          git config user.email "bb-bot@users.noreply.github.com"
          git add -f bb/logs
          git commit -m "bb round5: build.txt" || echo "nothing"
          git push || echo "push skipped"
          exit 0

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-apk
          path: out/
          retention-days: 30
          if-no-files-found: warn