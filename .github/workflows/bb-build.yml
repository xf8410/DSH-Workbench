name: bb-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bb/trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 磁盘
        run: df -h /

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 装 SDK 与 NDK r27c
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk1.log 2>&1
          echo "platform rc=$?"
          sdkmanager "ndk;27.2.12479018" > /tmp/ndk.log 2>&1
          echo "ndk rc=$?"
          tail -3 /tmp/ndk.log
          echo "--- ndk 目录 ---"
          ls "$ANDROID_HOME/ndk"
          df -h /
          exit 0

      - name: clone
        run: |
          set +e
          mkdir -p bb
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git bb/src
          echo "clone rc=$?"
          ls bb/src | head -20
          exit 0

      - name: patch NDK 版本
        run: |
          set +e
          cd bb/src || exit 0
          AVAIL=$(ls "$ANDROID_HOME/ndk" 2>/dev/null | head -1)
          echo "AVAIL=[$AVAIL]"
          if [ -n "$AVAIL" ]; then
            for f in $(grep -rl "ndkVersion" --include="*.gradle" . 2>/dev/null); do
              echo "== patch $f =="
              sed -i -E "s/ndkVersion[[:space:]]*=[[:space:]]*\"[0-9.]+\"/ndkVersion = \"$AVAIL\"/g" "$f"
            done
          fi
          grep -rn "ndkVersion" --include="*.gradle" . 2>/dev/null
          echo "=== cpp ==="
          ls Bcore/src/main/cpp 2>/dev/null | head
          exit 0

      - name: 编译
        run: |
          set +e
          cd bb/src || exit 0
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          RC=$?
          echo "===== gradle exit = $RC ====="
          wc -l "$GITHUB_WORKSPACE/build.log"
          echo "===== 前 40 行 ====="
          head -40 "$GITHUB_WORKSPACE/build.log"
          echo "===== 错误摘要 ====="
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|FAILED|Execution failed" "$GITHUB_WORKSPACE/build.log" | head -30
          df -h /
          exit 0

      - name: 立刻写回日志
        if: always()
        run: |
          set +e
          mkdir -p bb/logs
          cp build.log bb/logs/build.log 2>/dev/null
          ls -l bb/logs/
          git config user.name "bb-bot"
          git config user.email "bb-bot@users.noreply.github.com"
          git add bb/logs
          git commit -m "bb round4: build log" || echo "nothing"
          git push || echo "push skipped"
          exit 0

      - name: 收集 APK
        if: always()
        run: |
          set +e
          mkdir -p out
          find bb/src -name "*.apk" -exec cp {} out/ \; 2>/dev/null
          ls -l out/
          exit 0

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-apk
          path: out/
          retention-days: 30
          if-no-files-found: warn