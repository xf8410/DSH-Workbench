name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch fixed signing keystore
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/xf8410/hualuo-repo-tool/main/signing/release.keystore -o "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          sha256sum "$RUNNER_TEMP/release.keystore"

      - name: Fetch verified native runtime
        env:
          JNI_DIR: ${{ github.workspace }}/toolchains/out/jniLibs
        run: bash native/prebuilt.sh fetch

      - name: Build JavaScript engine
        env:
          OUT_DIR: ${{ github.workspace }}/toolchains/out/engine
        run: bash js/build-engine.sh

      - name: Engine tests
        shell: bash
        run: |
          set -o pipefail
          bash gradlew :engine:test \
            -Pdsh.nativeOut=${{ github.workspace }}/toolchains/out/jniLibs \
            -Pdsh.engineOut=${{ github.workspace }}/toolchains/out/engine \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-engine.log"

      - name: Assemble release APK (fixed signature)
        shell: bash
        run: |
          set -o pipefail
          bash gradlew :app:assembleRelease \
            -Pdsh.nativeOut=${{ github.workspace }}/toolchains/out/jniLibs \
            -Pdsh.engineOut=${{ github.workspace }}/toolchains/out/engine \
            -Pdsh.signing.storeFile="$RUNNER_TEMP/release.keystore" \
            -Pdsh.signing.storePassword=hualuo-override-install-2026 \
            -Pdsh.signing.keyAlias=hualuo \
            -Pdsh.signing.keyPassword=hualuo-override-install-2026 \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"

      - name: Record build failure notes
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "# build-apk failure：run ${{ github.run_id }} sha ${{ github.sha }}"
            for log in "$RUNNER_TEMP"/gradle-*.log; do
              [ -f "$log" ] || continue
              echo "## $(basename "$log")"
              echo '```'
              grep -aE '^(e: |error:|FAILURE:|> Task .*FAILED)|FAILED$|AssertionError|Expected:|Caused by' "$log" \
                | tail -n 8 | cut -c1-130 || true
              echo '```'
              tail -c 900 "$log" || true
            done
          } > ci/last-build-failure.md
          git config user.name "dsh-ci"
          git config user.email "dsh-ci@users.noreply.github.com"
          git switch -c ci-notes
          git add ci/last-build-failure.md
          git commit -m "ci: record build failure of ${{ github.sha }}" || true
          git push -f origin ci-notes || true

      - name: Verify APK runtime
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          unzip -t "$apk" >/dev/null
          entries="$(unzip -Z1 "$apk")"
          for entry in \
            lib/arm64-v8a/libnode.so \
            lib/arm64-v8a/libdshengine.so \
            lib/arm64-v8a/libdshnode.so \
            lib/arm64-v8a/libc++_shared.so \
            lib/arm64-v8a/libdsh_pty.so \
            lib/arm64-v8a/libdsh_flock.so \
            lib/arm64-v8a/librg.so \
            assets/engine.zip \
            assets/shizuku/shizuku.apk \
            assets/shizuku/LICENSE
          do
            printf '%s\n' "$entries" | grep -Fxq "$entry" || { echo "Missing APK entry: $entry" >&2; exit 1; }
          done
          unzip -p "$apk" assets/engine.zip > "$RUNNER_TEMP/engine.zip"
          unzip -t "$RUNNER_TEMP/engine.zip" >/dev/null

      - name: Record build info
        if: success()
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          mkdir -p ci
          {
            echo "# build ok：run ${{ github.run_id }} sha ${{ github.sha }}"
            echo '```'
            ls -l "$apk"
            APKSIGNER="$(command -v apksigner || true)"
            if [ -z "$APKSIGNER" ]; then APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -n 1)"; fi
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk" || true
            else
              echo "apksigner not found"
            fi
            echo '```'
          } > ci/last-build.md
          git config user.name "dsh-ci"
          git config user.email "dsh-ci@users.noreply.github.com"
          git switch -c ci-build
          git add ci/last-build.md
          git commit -m "ci: record build of ${{ github.sha }}" || true
          git push -f origin ci-build || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Workbench-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch verified native runtime
        env:
          JNI_DIR: ${{ github.workspace }}/toolchains/out/jniLibs
        run: bash native/prebuilt.sh fetch

      - name: Build JavaScript engine
        env:
          OUT_DIR: ${{ github.workspace }}/toolchains/out/engine
        run: bash js/build-engine.sh

      - name: App unit tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          bash gradlew :app:testDebugUnitTest \
            -Pdsh.nativeOut=${{ github.workspace }}/toolchains/out/jniLibs \
            -Pdsh.engineOut=${{ github.workspace }}/toolchains/out/engine \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-app-tests.log"

      - name: Record app test failure notes
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "# app-tests failure：run ${{ github.run_id }} sha ${{ github.sha }}"
            echo '```'
            grep -aE '^(e: |error:|FAILURE:|> Task .*FAILED)|FAILED$|AssertionError|Expected:|Caused by|> Task :app:test' "$RUNNER_TEMP/gradle-app-tests.log" \
              | tail -n 10 | cut -c1-130 || true
            echo '```'
            tail -c 1400 "$RUNNER_TEMP/gradle-app-tests.log" || true
          } > ci/last-failure.md
          git config user.name "dsh-ci"
          git config user.email "dsh-ci@users.noreply.github.com"
          git switch -c ci-notes
          git add ci/last-failure.md
          git commit -m "ci: record app-test failure of ${{ github.sha }}" || true
          git push -f origin ci-notes || true