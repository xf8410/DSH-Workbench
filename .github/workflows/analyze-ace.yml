name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round23 .bss 填充函数
        run: |
          mkdir -p out23
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === fcn.00371380 ===;
              pdf @ 0x371380;
            " "$F" > /tmp/r23a.txt 2>/dev/null || true
            wc -l /tmp/r23a.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r23a.txt out23/fill_
          fi

      - name: round23 fcn.00380730
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === fcn.00380730 ===;
              pdf @ 0x380730;
            " "$F" > /tmp/r23b.txt 2>/dev/null || true
            wc -l /tmp/r23b.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r23b.txt out23/f2_
          fi

      - name: round23 该函数的写入目标与来源
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== fcn.00371380 区间内 memcpy/字符串引用 ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn \
                --start-address=0x371380 --stop-address=0x372000 "$F" 2>/dev/null \
                | grep -E "bl\s+|adrp\s+x[0-9]+, [0-9a-f]+" | head -60
            } > out23/fill_ops.txt 2>&1
            cat out23/fill_ops.txt
          fi

      - name: 清单
        run: |
          ls -l out23/ || true
          du -sh out23/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis23
          path: out23/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis23
          cp out23/* ace/analysis23/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis23
          git commit -m "ace analysis23: bss fill function" || echo "nothing to commit"
          git push || echo "push skipped"