name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round27 暴力解密表 A
        run: |
          mkdir -p out27
          python3 - <<'PY'
          import sys

          SO = 'ace/tp2.so'
          BASE = 0x3e8645          # 表 A 起始
          END  = 0x3f71e9          # .rodata 结束
          VARIANTS = [
              (0x11, 4, 'v11'),
              (0x23, 7, 'v23'),
              (0x4e, 6, 'v4e'),
          ]

          data = open(SO, 'rb').read()
          print(f"so size = {len(data):#x}, table A = {BASE:#x}..{END:#x}")

          seen = set()
          hits = []
          span = END - BASE - 2

          for off in range(span):
              pos = BASE + off
              if pos + 1 >= len(data):
                  break
              key0 = data[pos]
              lenfield = data[pos + 1] ^ key0
              if not (2 <= lenfield <= 160):
                  continue
              if pos + 2 + lenfield > len(data):
                  continue

              for const, step, tag in VARIANTS:
                  k = key0
                  out = bytearray()
                  ok = True
                  for i in range(lenfield):
                      nb = ((k + i) & 0xff) ^ const
                      ch = data[pos + 2 + i] ^ k
                      out.append(ch)
                      k = (nb + step) & 0xff
                  # 可读性判定：全 printable
                  if all(32 <= c < 127 for c in out):
                      s = out.decode('ascii', 'replace')
                      sig = (off, tag, s)
                      if s not in seen:
                          seen.add(s)
                          hits.append((off, tag, s))

          print(f"hits = {len(hits)}")
          with open('out27/strings.txt', 'w', encoding='utf-8') as f:
              for off, tag, s in hits:
                  f.write(f"0x{off:#06x}\t{tag}\t{s}\n")

          # 额外统计：含关键字的结果
          kws = ['apk','dex','.so','proc','hook','frida','xposed','debug','root',
                 'emu','vap','tcj','check','md5','crc','sig','cert','tamper',
                 'integrity','kill','abort','detect','/data/','/system/','lib','maps']
          with open('out27/keywords.txt', 'w', encoding='utf-8') as f:
              for off, tag, s in hits:
                  low = s.lower()
                  if any(w in low for w in kws):
                      f.write(f"0x{off:#06x}\t{tag}\t{s}\n")
          print("keyword hits written")
          PY
          wc -l out27/*.txt 2>/dev/null || true
          echo "=== 前 80 条 ==="
          head -80 out27/strings.txt 2>/dev/null || true

      - name: round27 统计
        run: |
          echo "=== keyword 命中 ==="
          head -60 out27/keywords.txt 2>/dev/null || true

      - name: 清单
        run: |
          ls -l out27/ || true
          du -sh out27/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis27
          path: out27/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis27
          cp out27/* ace/analysis27/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis27
          git commit -m "ace analysis27: brute-force decrypt table A" || echo "nothing to commit"
          git push || echo "push skipped"