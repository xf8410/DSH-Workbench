name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round19 最上游 fcn.000fcf0c
        run: |
          mkdir -p out19
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              pdf @ 0xfcf0c;
            " "$F" > /tmp/r19a.txt 2>/dev/null || true
            wc -l /tmp/r19a.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r19a.txt out19/top_
          fi

      - name: round19 检查函数 1
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === fcn.00389738 ===;
              pdf @ 0x389738;
            " "$F" > /tmp/r19b.txt 2>/dev/null || true
            wc -l /tmp/r19b.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r19b.txt out19/chk1_
          fi

      - name: round19 检查函数 2
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === fcn.0038a764 ===;
              pdf @ 0x38a764;
            " "$F" > /tmp/r19c.txt 2>/dev/null || true
            wc -l /tmp/r19c.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r19c.txt out19/chk2_
          fi

      - name: round19 上游 xref 与链表消费
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === xref 0xfcf0c ===;
              axt @ 0xfcf0c;
              echo === xref 0xd463c ===;
              axt @ 0xd463c;
              echo === xref 0xfcb70 ===;
              axt @ 0xfcb70;
            " "$F" > out19/xrefs19.txt 2>/dev/null || true
            cat out19/xrefs19.txt
          fi

      - name: 清单
        run: |
          ls -l out19/ || true
          du -sh out19/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis19
          path: out19/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis19
          cp out19/* ace/analysis19/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis19
          git commit -m "ace analysis19: top-level caller + individual check functions" || echo "nothing to commit"
          git push || echo "push skipped"