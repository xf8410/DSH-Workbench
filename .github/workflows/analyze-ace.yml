name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file
          aarch64-linux-gnu-objdump --version | head -1

      - name: 探针列表
        run: |
          mkdir -p out2
          ls ace/*.so

      - name: 反编译关键函数（adt.s3.t）
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          {
            echo "### 引用 adt.s3.t 的函数 fcn.00303bec"
            r2 -q -e scr.color=false -e asm.lines=false -c "aaa; pdf @ 0x303bec" "$F" 2>/dev/null
          } > out2/tp2.fn_adt.txt
          wc -l out2/tp2.fn_adt.txt

      - name: 找 /proc 与 apk_path 的引用
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          {
            echo "--- xref /proc/%d/status (0x4e3edb) ---"
            r2 -q -e scr.color=false -c "aaa; axt @ 0x4e3edb" "$F" 2>/dev/null | head -30
            echo ""
            echo "--- xref .apk_path (0x3c474b) ---"
            r2 -q -e scr.color=false -c "aaa; axt @ 0x3c474b" "$F" 2>/dev/null | head -30
            echo ""
            echo "--- xref apk_path=%s (0x3c4768) ---"
            r2 -q -e scr.color=false -c "aaa; axt @ 0x3c4768" "$F" 2>/dev/null | head -30
            echo ""
            echo "--- xref inline_hook_opcode_dismatch (0x3cd4ad) ---"
            r2 -q -e scr.color=false -c "aaa; axt @ 0x3cd4ad" "$F" 2>/dev/null | head -30
            echo ""
            echo "--- xref /data/data/%s/files/adt.s3.t (0x3cf5b2) ---"
            r2 -q -e scr.color=false -c "aaa; axt @ 0x3cf5b2" "$F" 2>/dev/null | head -30
          } > out2/tp2.xref2.txt
          cat out2/tp2.xref2.txt

      - name: 找 open/fopen 调用点
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          {
            echo "--- 引用 open 的地址 ---"
            r2 -q -e scr.color=false -c "aaa; axt @ sym.imp.open" "$F" 2>/dev/null | head -40
            echo ""
            echo "--- 引用 fopen 的地址 ---"
            r2 -q -e scr.color=false -c "aaa; axt @ sym.imp.fopen" "$F" 2>/dev/null | head -40
            echo ""
            echo "--- 引用 __open_2 ---"
            r2 -q -e scr.color=false -c "aaa; axt @ sym.imp.__open_2" "$F" 2>/dev/null | head -20
          } > out2/tp2.io_calls.txt
          cat out2/tp2.io_calls.txt

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis2
          path: out2/
          retention-days: 30

      - name: 结果写回仓库
        run: |
          mkdir -p ace/analysis2
          cp out2/*.txt ace/analysis2/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis2
          git commit -m "ace analysis2" || echo "nothing to commit"
          git push || echo "push skipped"