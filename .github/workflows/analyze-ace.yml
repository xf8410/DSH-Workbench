name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round12 三个校验函数本体
        run: |
          mkdir -p out12
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === fcn.0012c190 (file md5) ===;
            pdf @ 0x12c190;
            echo === fcn.0012d0ec (tcj zip loader) ===;
            pdf @ 0x12d0ec;
            echo === fcn.001063dc (ver/crc) ===;
            pdf @ 0x1063dc;
            echo === fcn.00116034 (ano_cert_md5) ===;
            pdf @ 0x116034;
          " "$F" > /tmp/r12.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/r12.txt)"
          split -l 110 -d -a 3 /tmp/r12.txt out12/r12_

      - name: round12 证书校验（分段）
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === fcn.003065dc (cert) ===;
            pdf @ 0x3065dc;
          " "$F" > /tmp/r12b.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/r12b.txt)"
          split -l 110 -d -a 3 /tmp/r12b.txt out12/cert_

      - name: round12 剩余字符串引用
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === 0x3c4670 crc:t ===;
            axt @ 0x3c4670;
            echo === 0x3c36aa sig custom ===;
            axt @ 0x3c36aa;
            echo === 0x3c4acc tcj_protect ===;
            axt @ 0x3c4acc;
            echo === 0x3c4a5e pub_tcj ===;
            axt @ 0x3c4a5e;
          " "$F" > out12/xrefs12.txt 2>/dev/null || true
          cat out12/xrefs12.txt

      - name: 清单
        run: ls -l out12/ && du -sh out12/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis12
          path: out12/
          retention-days: 30

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis12
          cp out12/* ace/analysis12/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis12
          git commit -m "ace analysis12: md5/cert/ver check bodies" || echo "nothing to commit"
          git push || echo "push skipped"