name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round8 ApkAbort 主函数与 mrpcs
        run: |
          mkdir -p out8
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === fcn.001830c0 (ApkAbort) ===;
            pdf @ 0x1830c0;
            echo === fcn.00105318 (mrpcs_abort.dat) ===;
            pdf @ 0x105318;
          " "$F" > /tmp/r8.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/r8.txt)"
          split -l 120 -d -a 3 /tmp/r8.txt out8/r8_

      - name: round8 调用者链
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === xref fcn.001830c0 ===;
            axt @ 0x1830c0;
            echo === xref fcn.00105318 ===;
            axt @ 0x105318;
          " "$F" > out8/callers.txt 2>/dev/null || true
          cat out8/callers.txt

      - name: round8 校验相关字符串落点
        run: |
          F=ace/tp2.so
          {
            echo "=== 与 APK / 校验有关的高价值字符串 ==="
            strings -n 6 "$F" | grep -iE "apk|signature|cert|integrity|tamper|checksum|md5|crc" | sort -u | head -60
          } > out8/keystrings.txt
          cat out8/keystrings.txt

      - name: 清单
        run: ls -l out8/ && du -sh out8/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis8
          path: out8/
          retention-days: 30

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis8
          cp out8/* ace/analysis8/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis8
          git commit -m "ace analysis8: ApkAbort body + callers" || echo "nothing to commit"
          git push || echo "push skipped"