name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: 准备
        run: |
          mkdir -p out4
          ls -l ace/*.so

      - name: dump fcn.003011a4（分片）
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "aaa; pdf @ 0x3011a4" "$F" > /tmp/fn4.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/fn4.txt)"
          split -l 120 -d -a 3 /tmp/fn4.txt out4/fn011a4_
          ls -l out4/ | head -20

      - name: dump 4 个 open 调用点
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          {
            echo "########## fcn.001a028c (open @0x1a0310) ##########"
            r2 -q -e scr.color=false -e asm.lines=false -c "aaa; pdf @ 0x1a028c" "$F" 2>/dev/null
            echo ""
            echo "########## fcn.00347f60 (open @0x347dcc / 0x347dd4) ##########"
            r2 -q -e scr.color=false -e asm.lines=false -c "aaa; pdf @ 0x347f60" "$F" 2>/dev/null
            echo ""
            echo "########## fcn.00349d44 (open @0x349d84) ##########"
            r2 -q -e scr.color=false -e asm.lines=false -c "aaa; pdf @ 0x349d44" "$F" 2>/dev/null
          } > /tmp/open4.txt
          echo "总行数: $(wc -l < /tmp/open4.txt)"
          split -l 120 -d -a 3 /tmp/open4.txt out4/open4_

      - name: dump adt.s3.t 写函数
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "aaa; pdf @ 0x303bec" "$F" > /tmp/adt.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/adt.txt)"
          split -l 120 -d -a 3 /tmp/adt.txt out4/adt_

      - name: 清单
        run: |
          ls -l out4/ | head -40
          du -sh out4/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis4
          path: out4/
          retention-days: 30

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis4
          cp out4/* ace/analysis4/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis4
          git commit -m "ace analysis4: segmented disasm" || echo "nothing to commit"
          git push || echo "push skipped"