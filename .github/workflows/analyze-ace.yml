name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round17 MD5 三件套
        run: |
          mkdir -p out17
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === fcn.00338db4 (md5 init?) ===;
              pdf @ 0x338db4;
              echo === fcn.0033ab2c (md5 transform?) ===;
              pdf @ 0x33ab2c;
              echo === fcn.0033ab9c ===;
              pdf @ 0x33ab9c;
            " "$F" > /tmp/r17.txt 2>/dev/null || true
            wc -l /tmp/r17.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r17.txt out17/md5_
          fi

      - name: round17 十个分片配置码
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== fcn.0037b0ac 里的配置码与分片源 ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn \
                --start-address=0x37b0ac --stop-address=0x37b560 "$F" 2>/dev/null \
                | grep -E "mov\s+w0, 0x[0-9a-f]+|mov\s+w10, 0x|add\s+x8, x8|x9, x9|bl\s+34a5c0|tbz|b\s+37b54c" | head -80
            } > out17/shards.txt 2>&1
            cat out17/shards.txt
          fi

      - name: round17 汇合点后续
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === 0x37b54c 之后 ===;
              pd 100 @ 0x37b54c;
            " "$F" > out17/conv.txt 2>/dev/null || true
            wc -l out17/conv.txt 2>/dev/null || true
            head -60 out17/conv.txt 2>/dev/null || true
          fi

      - name: 清单
        run: |
          ls -l out17/ || true
          du -sh out17/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis17
          path: out17/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis17
          cp out17/* ace/analysis17/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis17
          git commit -m "ace analysis17: MD5 trio + 10 shard codes" || echo "nothing to commit"
          git push || echo "push skipped"