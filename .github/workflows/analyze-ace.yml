name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round26 表 B 填充函数上下文
        run: |
          mkdir -p out26
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== 0xc4e00..0xc5200 全量反汇编（含 0xc4f34）==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn \
                --start-address=0xc4e00 --stop-address=0xc5200 "$F" 2>/dev/null
            } > out26/fill_ctx.txt 2>&1
            wc -l out26/fill_ctx.txt
            head -120 out26/fill_ctx.txt
          fi

      - name: round26 源数据来源
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== 0xc4e00..0xc5200 的 adrp/add 立即数 ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn \
                --start-address=0xc4e00 --stop-address=0xc5200 "$F" 2>/dev/null \
                | grep -E "adrp|add\s+x[0-9]+, x[0-9]+, #0x|bl\s+" | head -60
            } > out26/fill_src.txt 2>&1
            cat out26/fill_src.txt
          fi

      - name: 清单
        run: |
          ls -l out26/ || true
          du -sh out26/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis26
          path: out26/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis26
          cp out26/* ace/analysis26/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis26
          git commit -m "ace analysis26: table B fill context" || echo "nothing to commit"
          git push || echo "push skipped"