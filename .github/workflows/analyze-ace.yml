name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round25 表 B 偏移引用（0x6b0）
        run: |
          mkdir -p out25
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== 所有 add xN, xN, #0x6b0（表 B 偏移） ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn "$F" 2>/dev/null \
                | grep -nE "add\s+x[0-9]+, x[0-9]+, #0x6b0" | head -20
              echo ""
              echo "=== 所有 ldr/str 0x6b0 偏移 ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn "$F" 2>/dev/null \
                | grep -nE "(ldr|str)\s+[ wx][0-9]+, \[x[0-9]+, #0x6b0\]" | head -20
              echo ""
              echo "=== 0x514000 附近的 adrp 全部列出 ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn "$F" 2>/dev/null \
                | grep -nE "adrp\s+x[0-9]+, 514000" | head -20
            } > out25/tableB_refs.txt 2>&1
            cat out25/tableB_refs.txt
          fi

      - name: round25 表 A 与表 B 的相对关系
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== 表 A 0x3e8645 之后 4KB（看是否连续字符串池）==="
              aarch64-linux-gnu-objdump -s --start-address=0x3e8645 --stop-address=0x3e9645 "$F" 2>/dev/null | head -40
            } > out25/tableA_ext.txt 2>&1
            cat out25/tableA_ext.txt
          fi

      - name: round25 init 函数全集里对 0x514xxx 的写
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== .init_array 区间 0xc4500..0xc5c00 中 adrp 514000 ==="
              aarch64-linux-gnu-objdump -d --no-show-raw-insn \
                --start-address=0xc4500 --stop-address=0xc5c00 "$F" 2>/dev/null \
                | grep -nE "adrp\s+x[0-9]+, 514000"
            } > out25/init_bss.txt 2>&1
            cat out25/init_bss.txt
          fi

      - name: 清单
        run: |
          ls -l out25/ || true
          du -sh out25/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis25
          path: out25/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis25
          cp out25/* ace/analysis25/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis25
          git commit -m "ace analysis25: table B writers + table A extent" || echo "nothing to commit"
          git push || echo "push skipped"