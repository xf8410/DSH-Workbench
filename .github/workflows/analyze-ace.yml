name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round21 .bss 表 B 的写入者
        run: |
          mkdir -p out21
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === xref 0x5146b0 (table B) ===;
              axt @ 0x5146b0;
              echo === xref 0x514000 (segment base) ===;
              axt @ 0x514000;
            " "$F" > out21/bss_writers.txt 2>/dev/null || true
            cat out21/bss_writers.txt
          fi

      - name: round21 表 A 内容 dump
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== 表 A 0x3e8645 起 512 字节 ==="
              aarch64-linux-gnu-objdump -s --start-address=0x3e8645 --stop-address=0x3e8845 "$F" 2>/dev/null
            } > out21/tableA_dump.txt 2>&1
            cat out21/tableA_dump.txt
          fi

      - name: round21 段表完整（找 .data/.bss）
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== program headers ==="
              aarch64-linux-gnu-readelf -l "$F" 2>/dev/null
              echo ""
              echo "=== section headers 尾部 ==="
              aarch64-linux-gnu-readelf -S "$F" 2>/dev/null | tail -30
            } > out21/segments.txt 2>&1
            cat out21/segments.txt
          fi

      - name: 清单
        run: |
          ls -l out21/ || true
          du -sh out21/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis21
          path: out21/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis21
          cp out21/* ace/analysis21/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis21
          git commit -m "ace analysis21: table B writers + table A dump + segments" || echo "nothing to commit"
          git push || echo "push skipped"