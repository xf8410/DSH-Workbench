name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round22 init48 与 .bss 初始化
        run: |
          mkdir -p out22
          F=ace/tp2.so
          if [ -f "$F" ]; then
            r2 -q -e scr.color=false -e asm.lines=false -c "
              aaa;
              echo === 0xc5b00 附近（init48 主体）===;
              pd 200 @ 0xc5b00;
            " "$F" > /tmp/r22a.txt 2>/dev/null || true
            wc -l /tmp/r22a.txt 2>/dev/null || true
            split -l 120 -d -a 3 /tmp/r22a.txt out22/init_
          fi

      - name: round22 .init_array 内容
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== .init_array 条目（0x4ab9d8, 0x188 字节 = 49 项）==="
              aarch64-linux-gnu-objdump -s -j .init_array "$F" 2>/dev/null | head -30
            } > out22/init_array.txt 2>&1
            cat out22/init_array.txt
          fi

      - name: round22 表 A 内容
        run: |
          F=ace/tp2.so
          if [ -f "$F" ]; then
            {
              echo "=== 表 A 0x3e8645 起 384 字节 ==="
              aarch64-linux-gnu-objdump -s --start-address=0x3e8645 --stop-address=0x3e87c5 "$F" 2>/dev/null
            } > out22/tableA.txt 2>&1
            cat out22/tableA.txt
          fi

      - name: 清单
        run: |
          ls -l out22/ || true
          du -sh out22/ || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis22
          path: out22/
          retention-days: 30
          if-no-files-found: warn

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis22
          cp out22/* ace/analysis22/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis22
          git commit -m "ace analysis22: init48 body + init_array + table A" || echo "nothing to commit"
          git push || echo "push skipped"