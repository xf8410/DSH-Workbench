name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round11 tcj/vap 字符串地址与引用
        run: |
          mkdir -p out11
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -c "
            izz~tcj
            izz~vap
            izz~crc
            izz~code_size
            izz~sig_custom
            izz~cert_md5
          " "$F" > out11/str_addrs.txt 2>/dev/null || true
          cat out11/str_addrs.txt

      - name: round11 按地址找引用
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          # 先提取 tcj / vap 的 vaddr
          T=$(grep -oE "0x[0-9a-f]+" out11/str_addrs.txt | head -20 | tr '\n' ' ')
          echo "候选地址: $T"
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            $(for a in $T; do echo "echo === xref $a ===; axt @ $a;"; done)
          " "$F" > out11/xrefs.txt 2>/dev/null || true
          cat out11/xrefs.txt

      - name: round11 按字符串直接找（argv 方式）
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === tcj ===;
            axt @@ str.*tcj*;
            echo === vap ===;
            axt @@ str.*vap*;
            echo === cert_md5 ===;
            axt @@ str.*cert_md5*;
            echo === code_size ===;
            axt @@ str.*code_size*;
          " "$F" > out11/xrefs2.txt 2>/dev/null || true
          cat out11/xrefs2.txt

      - name: 清单
        run: ls -l out11/ && du -sh out11/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis11
          path: out11/
          retention-days: 30

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis11
          cp out11/* ace/analysis11/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis11
          git commit -m "ace analysis11: tcj/vap hash check xrefs" || echo "nothing to commit"
          git push || echo "push skipped"