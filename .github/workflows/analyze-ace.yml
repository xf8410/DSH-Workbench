name: analyze-ace

on:
  workflow_dispatch:
  push:
    paths:
      - 'ace/*.so'
      - 'ace/trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu radare2 file

      - name: round7 ApkAbort xref
        run: |
          mkdir -p out7
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === xref ApkAbort_CS_Cnt 0x3c8d58 ===;
            axt @ 0x3c8d58;
            echo === xref ApkAbort_CS_pctd 0x3c8d68 ===;
            axt @ 0x3c8d68;
            echo === xref mrpcs_abort.dat 0x3c3680 ===;
            axt @ 0x3c3680;
            echo === xref FakeIdByOpenId ===;
            izz~FakeIdByOpenId;
            echo === xref AndroidID ===;
            izz~AndroidID;
          " "$F" > /tmp/r7.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/r7.txt)"
          cat /tmp/r7.txt
          cp /tmp/r7.txt out7/apkabort_xref.txt

      - name: round7 abort 包装函数
        run: |
          F=ace/tp2.so
          [ -f "$F" ] || exit 0
          r2 -q -e scr.color=false -e asm.lines=false -c "
            aaa;
            echo === fcn.003bf3a4 ===;
            pdf @ 0x3bf3a4;
            echo === fcn.003bf438 ===;
            pdf @ 0x3bf438;
            echo === fcn.003bf54c ===;
            pdf @ 0x3bf54c;
            echo === fcn.00347f50 ===;
            pdf @ 0x347f50;
          " "$F" > /tmp/r7b.txt 2>/dev/null || true
          echo "总行数: $(wc -l < /tmp/r7b.txt)"
          split -l 120 -d -a 3 /tmp/r7b.txt out7/abw_

      - name: 清单
        run: ls -l out7/ && du -sh out7/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis7
          path: out7/
          retention-days: 30

      - name: 写回仓库
        run: |
          mkdir -p ace/analysis7
          cp out7/* ace/analysis7/ 2>/dev/null || true
          git config user.name "ace-bot"
          git config user.email "ace-bot@users.noreply.github.com"
          git add ace/analysis7
          git commit -m "ace analysis7: ApkAbort xref + abort wrappers" || echo "nothing to commit"
          git push || echo "push skipped"